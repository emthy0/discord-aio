services:

  discord-aio:
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    image: discord-aio
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  jai-tts-service:
    build:
      context: ./jai-tts-service
      dockerfile: Dockerfile
    restart: always
    environment:
      JAI_TTS_REF_AUDIO: /data/ref.wav
      JAI_TTS_REF_TEXT: ${JAI_TTS_REF_TEXT:-}
      JAI_TTS_MODEL: ${JAI_TTS_MODEL:-}
      JAI_TTS_VOCAB: ${JAI_TTS_VOCAB:-}
    volumes:
      - ${JAI_TTS_REF_AUDIO:-/dev/null}:/data/ref.wav:ro
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    profiles:
      - jai

volumes:
  hf_cache:
