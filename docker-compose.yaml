services:

  discord-aio:
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    image: discord-aio
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  jai-tts-service:
    build:
      context: ./jai-tts-service
      dockerfile: Dockerfile
    restart: always
    environment:
      HF_TOKEN: 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
      JAI_TTS_REF_AUDIO: ./ref_audio.wav
      JAI_TTS_REF_TEXT: ฉันเดินทางไปเที่ยวที่จังหวัดเชียงใหม่ในช่วงฤดูหนาวเพื่อสัมผัสอากาศเย็นสบาย
      # JAI_TTS_MODEL: /assets/model.pt
      # JAI_TTS_VOCAB: /assets/vocab.txt
    volumes:
      - ${JAI_TTS_REF_AUDIO:-/dev/null}:/data/ref.wav:ro
      - hf_cache:/root/.cache/huggingface
      - ./jai-tts-service/assets:/assets
    ports:
      - "8000:8000"
    profiles:
      - jai

volumes:
  hf_cache:
